name: Build mod draft

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        name: Build Windows x64 draft
        runs-on: windows-2025
        timeout-minutes: 60
        env:
            NO_COLOR: 1

        steps:
            - name: Checkout selected commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  check-latest: true
                  package-manager-cache: false

            - name: Install locked dependencies
              shell: pwsh
              run: |
                  corepack enable
                  if ($LASTEXITCODE -ne 0) { throw 'Corepack setup failed.' }
                  yarn install --immutable
                  if ($LASTEXITCODE -ne 0) { throw 'Toolset dependencies installation failed.' }
                  yarn --cwd src install --immutable
                  if ($LASTEXITCODE -ne 0) { throw 'Application dependencies installation failed.' }

            - name: Install pinned Rust toolchains
              shell: pwsh
              run: |
                  $toolchains = Get-ChildItem -Path 'native/*/rust/rust-toolchain.toml' | ForEach-Object {
                    $match = [regex]::Match((Get-Content -Raw -LiteralPath $_.FullName), 'channel\s*=\s*"([\d.]+)"')
                    if (-not $match.Success) { throw 'Missing pinned Rust toolchain.' }
                    $match.Groups[1].Value
                  } | Sort-Object -Unique
                  foreach ($toolchain in $toolchains) {
                    rustup toolchain install $toolchain --profile minimal --target x86_64-pc-windows-msvc
                    if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
                  }

            - name: Run release checks
              shell: pwsh
              run: |
                  $env:Path = (Join-Path $env:ProgramFiles 'Git\bin') + [IO.Path]::PathSeparator + $env:Path
                  yarn test:release
                  if ($LASTEXITCODE -ne 0) { throw 'Release checks failed.' }

            - name: Build and smoke-test the portable ZIP
              id: build
              run: node toolset/ci/build-mod-draft.js

            - name: Upload portable ZIP
              id: artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  path: ${{ steps.build.outputs.zip }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Create draft release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
                  DRAFT_TAG: ${{ steps.build.outputs.tag }}
                  DRAFT_TITLE: ${{ steps.build.outputs.title }}
                  BUILD_SHA: ${{ steps.build.outputs.commit }}
                  ZIP_PATH: ${{ steps.build.outputs.zip }}
                  CHECKSUM_PATH: ${{ steps.build.outputs.checksum }}
                  NOTES_PATH: ${{ steps.build.outputs.notes }}
                  ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
              run: |
                  $releaseUrl = gh release create $env:DRAFT_TAG $env:ZIP_PATH $env:CHECKSUM_PATH --repo $env:GITHUB_REPOSITORY --target $env:BUILD_SHA --draft --title $env:DRAFT_TITLE --notes-file $env:NOTES_PATH
                  if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
                  "[Черновик GitHub Release]($releaseUrl)" >> $env:GITHUB_STEP_SUMMARY
                  "[Скачать ZIP из GitHub Actions]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
