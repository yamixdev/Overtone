name: Build mod draft

on:
    workflow_dispatch:
        inputs:
            mod_version:
                description: Overtone version (defaults to the version in package.json)
                type: string
                required: false
            smoke_test:
                description: Launch Electron on the runner to check startup
                type: boolean
                default: false

permissions:
    contents: write

jobs:
    build:
        name: Build Windows x64 draft
        runs-on: windows-2025
        timeout-minutes: 60
        env:
            NO_COLOR: 1
            ELECTRON_SKIP_BINARY_DOWNLOAD: 1

        steps:
            - name: Checkout selected commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  check-latest: true
                  package-manager-cache: false

            - name: Install locked dependencies
              shell: pwsh
              run: |
                  corepack enable
                  if ($LASTEXITCODE -ne 0) { throw 'Corepack setup failed.' }
                  yarn install --immutable
                  if ($LASTEXITCODE -ne 0) { throw 'Toolset dependencies installation failed.' }
                  yarn --cwd src install --immutable
                  if ($LASTEXITCODE -ne 0) { throw 'Application dependencies installation failed.' }

            - name: Install pinned Rust toolchains
              shell: pwsh
              run: |
                  $toolchains = Get-ChildItem -Path 'native/*/rust/rust-toolchain.toml' | ForEach-Object {
                    $match = [regex]::Match((Get-Content -Raw -LiteralPath $_.FullName), 'channel\s*=\s*"([\d.]+)"')
                    if (-not $match.Success) { throw 'Missing pinned Rust toolchain.' }
                    $match.Groups[1].Value
                  } | Sort-Object -Unique
                  foreach ($toolchain in $toolchains) {
                    rustup toolchain install $toolchain --profile minimal --target x86_64-pc-windows-msvc
                    if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
                  }

            - name: Run release checks
              shell: pwsh
              run: |
                  $env:Path = (Join-Path $env:ProgramFiles 'Git\bin') + [IO.Path]::PathSeparator + $env:Path
                  yarn test:release
                  if ($LASTEXITCODE -ne 0) { throw 'Release checks failed.' }

            - name: Build the portable ZIP and Windows installer
              id: build
              env:
                  OVERTONE_BUILD_VERSION: ${{ inputs.mod_version }}
                  OVERTONE_ELECTRON_SMOKE_TEST: ${{ inputs.smoke_test }}
              run: node toolset/ci/build-mod-draft.js

            - name: Upload portable ZIP
              id: portable_artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  path: ${{ steps.build.outputs.zip }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload Windows installer
              id: installer_artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  path: ${{ steps.build.outputs.installer }}
                  archive: false
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload SHA-256 checksums
              id: checksum_artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: windows-x64-checksums
                  path: |
                      ${{ steps.build.outputs.checksum }}
                      ${{ steps.build.outputs.installerChecksum }}
                  if-no-files-found: error
                  retention-days: 14

            - name: Create draft release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
                  DRAFT_TAG: ${{ steps.build.outputs.tag }}
                  DRAFT_TITLE: ${{ steps.build.outputs.title }}
                  BUILD_SHA: ${{ steps.build.outputs.commit }}
                  ZIP_PATH: ${{ steps.build.outputs.zip }}
                  CHECKSUM_PATH: ${{ steps.build.outputs.checksum }}
                  INSTALLER_PATH: ${{ steps.build.outputs.installer }}
                  INSTALLER_CHECKSUM_PATH: ${{ steps.build.outputs.installerChecksum }}
                  NOTES_PATH: ${{ steps.build.outputs.notes }}
                  PORTABLE_ARTIFACT_URL: ${{ steps.portable_artifact.outputs.artifact-url }}
                  INSTALLER_ARTIFACT_URL: ${{ steps.installer_artifact.outputs.artifact-url }}
                  CHECKSUM_ARTIFACT_URL: ${{ steps.checksum_artifact.outputs.artifact-url }}
              run: |
                  $releaseUrl = gh release create $env:DRAFT_TAG $env:ZIP_PATH $env:CHECKSUM_PATH $env:INSTALLER_PATH $env:INSTALLER_CHECKSUM_PATH --repo $env:GITHUB_REPOSITORY --target $env:BUILD_SHA --draft --title $env:DRAFT_TITLE --notes-file $env:NOTES_PATH
                  if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
                  "[Черновик GitHub Release]($releaseUrl)" >> $env:GITHUB_STEP_SUMMARY
                  "[Скачать ZIP из GitHub Actions]($env:PORTABLE_ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
                  "[Скачать установщик из GitHub Actions]($env:INSTALLER_ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
                  "[Скачать контрольные суммы из GitHub Actions]($env:CHECKSUM_ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
