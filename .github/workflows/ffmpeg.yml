name: Mirror FFmpeg binaries (manual)

on:
    workflow_dispatch:
        inputs:
            ffmpeg_version:
                description: 'Exact FFmpeg version currently published by foreA-adoxid/ffmpeg-builds'
                type: string
                default: '9.0.2'
                required: true

concurrency:
    group: ffmpeg-binaries
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    mirror:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download and verify FFmpeg binaries and sources
              shell: pwsh
              run: |
                  ./toolset/ci/prepare-ffmpeg-assets.ps1 -Version $env:FFMPEG_VERSION -OutputDirectory (Join-Path $env:RUNNER_TEMP 'ffmpeg-assets')

            - name: Publish the verified version and update the FFmpeg channel
              shell: pwsh
              run: |
                  ./toolset/ci/publish-ffmpeg-assets.ps1 -Version $env:FFMPEG_VERSION -AssetDirectory (Join-Path $env:RUNNER_TEMP 'ffmpeg-assets')
